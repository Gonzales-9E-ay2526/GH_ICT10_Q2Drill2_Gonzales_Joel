<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2nd Quarter Drill 2</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100" style="background-image: url('https://img.magnific.com/premium-vector/colorful-school-themed-border-vector-illustration-with-educational-supplies-tools-school-frame_860626-230.jpg?semt=ais_hybrid&w=740&q=80'); background-repeat: no-repeat; background-size: cover; background-position: center;">

    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h4 class="mb-3 text-center">Add New Club Member</h4>
        <form class="mb-3">
            <div class="mb-3">

                <!-- Input form for first and last name -->
                <input type="text" id="first_name" class="form-control" placeholder="First Name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Last Name">
            </div>

                <!-- Button to add the new member-->
            <input type="button" value="Submit" py-click="result_checker" class="btn btn-primary w-100">
        </form>
        <div id="result" class="p-3 rounded text-white text-center" style="background-color: rgb(255, 69, 193);"></div>
    </div>

    <!-- Links the external Python logic file to PyScript -->
    <py-script src="main.py"></py-script>
</body>
</html>
